# Render.com Blueprint - Automated deployment for Texas Energy Analyzer
# This file configures both backend and database on Render

services:
  # Backend API
  # Docker runtime: the Dockerfile pre-installs Playwright Chromium + all system
  # dependencies, which cannot be installed on Render's native Python runtime
  # (playwright install-deps requires root). This is required for scrapers to work.
  - type: web
    name: texas-energy-backend
    runtime: docker
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: texas-energy-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: texas-energy-db
    region: oregon
    plan: free
    databaseName: texas_energy
    user: texas_energy_user
